server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # AZURE MIGRATION: config.json is generated fresh every container start
    # (see docker-entrypoint.sh) and must never be served from cache — a
    # stale cached copy would point the UI at the wrong backend URLs after
    # a redeploy.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
